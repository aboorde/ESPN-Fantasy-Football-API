name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
jobs:
  dependencies-cache:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Cache node_modules
        id: cache-node-modules-node
        uses: actions/cache/save@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-modules-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
  lint:
    runs-on: ubuntu-latest
    needs: dependencies-cache
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Restore node_modules cache
        id: restore-cache-node-modules-node
        uses: actions/cache/restore@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-modules-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    needs: dependencies-cache
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Restore node_modules cache
        id: restore-cache-node-modules-node
        uses: actions/cache/restore@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-modules-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
      - run: npm run test
  build:
    runs-on: ubuntu-latest
    needs: dependencies-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore node_modules cache
        id: restore-cache-node-modules-node
        uses: actions/cache/restore@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-modules-24-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      # The built bundles are committed so that consumers can install this repo
      # straight from git. Fail if they drift from src/.
      - name: Verify committed bundles are up to date
        run: |
          if ! git diff --quiet -- web.js node.js node.js.LICENSE.txt web-dev.js node-dev.js; then
            echo "::error::Committed bundles are stale. Run 'npm run build' and commit the result."
            git diff --stat -- web.js node.js node.js.LICENSE.txt web-dev.js node-dev.js
            exit 1
          fi
