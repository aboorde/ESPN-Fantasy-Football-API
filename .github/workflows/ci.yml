name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
jobs:
  # Lint output does not vary with the host Node version, so it runs once rather than
  # once per matrix leg. `test` covers both supported versions.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test

  # Pinned to the version in .nvmrc. The committed bundles are byte-compared below, so this
  # must match the version contributors build on.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The built bundles are committed so that consumers can install this repo
      # straight from git. Fail if they drift from src/.
      - name: Verify committed bundles are up to date
        run: |
          bundles="node.js node-dev.js node.js.LICENSE.txt node.js.map"
          drift=$(git diff --stat -- $bundles)
          if [ -n "$drift" ]; then
            echo "::error::Committed bundles are stale. Run 'npm run build' and commit the result."
            echo "$drift"
            exit 1
          fi
